<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Brew &amp; Bean</title>
  <meta name="description" content="Forgot your password? Enter your email to receive a password reset link.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body style="background: var(--cream);">

  <!-- ================= NAVBAR ================= -->
  <nav class="navbar" id="main-navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <div class="logo-icon">☕</div>
        Brew &amp; Bean
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="subscription.html">Subscription</a>
        <a href="track-order.html">Track Order</a>
      </div>
      <div class="nav-actions">
        <a href="track-order.html" class="nav-icon-btn" title="Track Order">🚚</a>
        <a href="cart.html" class="nav-icon-btn" title="Cart" style="position:relative">
          🛒
          <span class="cart-badge" style="display:none">0</span>
        </a>
        <div class="hamburger" id="hamburger">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </nav>

  <!-- Mobile Navigation -->
  <div class="mobile-nav" id="mobile-nav">
    <a href="index.html">🏠 Home</a>
    <a href="menu.html">☕ Menu</a>
    <a href="subscription.html">⭐ Subscription</a>
    <a href="track-order.html">🚚 Track Order</a>
    <a href="cart.html">🛒 Cart</a>
  </div>

  <!-- ================= FORGOT PASSWORD CARD ================= -->
  <main class="section" style="padding-top: calc(var(--nav-height) + 40px); min-height: 85vh; display: flex; align-items: center;">
    <div class="container" style="max-width: 460px;">
      
      <div class="checkout-card" style="padding: 40px 32px; box-shadow: var(--shadow-lg); border-radius: var(--radius-xl); background: var(--white);">
        
        <div style="text-align: center; margin-bottom: 28px;">
          <div style="font-size: 2.2rem; margin-bottom: 8px;">🔑</div>
          <h1 style="font-size: 1.8rem; margin-bottom: 6px;">Reset Password</h1>
          <p style="color: var(--gray-600); font-size: 0.9rem;">
            Enter your account email address and we'll send you a secure link to reset your password.
          </p>
        </div>

        <div id="forgot-alert" style="display: none; padding: 12px 16px; border-radius: var(--radius-md); font-size: 0.88rem; margin-bottom: 20px;"></div>

        <form id="forgot-form" onsubmit="handleForgotPassword(event)">
          <div class="form-group" style="margin-bottom: 20px;">
            <label class="form-label" for="reset-email">Email Address</label>
            <input type="email" id="reset-email" class="form-input" placeholder="name@example.com" required autocomplete="email">
          </div>

          <button type="submit" id="btn-forgot-submit" class="btn btn-primary btn-full btn-lg" style="margin-bottom: 20px;">
            Send Password Reset Link
          </button>
        </form>

        <div style="text-align: center; font-size: 0.88rem; color: var(--gray-600); border-top: 1px solid var(--gray-200); padding-top: 20px;">
          Remembered your password? <a href="login.html" style="color: var(--coffee); font-weight: 700; text-decoration: underline;">Back to Sign In</a>
        </div>

      </div>

    </div>
  </main>

  <!-- ================= SCRIPTS ================= -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/customer-auth.js"></script>

  <script>
    function showAlert(msg, type = 'error') {
      const el = document.getElementById('forgot-alert');
      el.textContent = msg;
      el.style.display = 'block';
      if (type === 'error') {
        el.style.background = '#fdecea';
        el.style.color = '#c0392b';
        el.style.border = '1px solid #fadbd8';
      } else {
        el.style.background = '#edf7f1';
        el.style.color = '#2d8a4e';
        el.style.border = '1px solid #d4efdf';
      }
    }

    async function handleForgotPassword(e) {
      e.preventDefault();
      const email = document.getElementById('reset-email').value.trim();
      const btn = document.getElementById('btn-forgot-submit');

      if (!email) {
        showAlert('Please enter your email address.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = 'Sending Reset Link...';

      try {
        await customerResetPassword(email);
        showAlert('Password reset link sent! Please check your email inbox.', 'success');
        document.getElementById('forgot-form').reset();
      } catch (err) {
        console.error('Password reset error:', err);
        showAlert(err.message || 'Unable to send reset link. Please check your email address.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Send Password Reset Link';
      }
    }
  </script>
</body>
</html>
