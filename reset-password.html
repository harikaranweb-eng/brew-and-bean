<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — Brew &amp; Bean</title>
  <meta name="description" content="Set a new secure password for your Brew & Bean customer account.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body style="background: var(--cream);">

  <!-- ================= NAVBAR ================= -->
  <nav class="navbar" id="main-navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <div class="logo-icon">☕</div>
        Brew &amp; Bean
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="subscription.html">Subscription</a>
        <a href="track-order.html">Track Order</a>
      </div>
      <div class="nav-actions">
        <a href="track-order.html" class="nav-icon-btn" title="Track Order">🚚</a>
        <a href="cart.html" class="nav-icon-btn" title="Cart" style="position:relative">
          🛒
          <span class="cart-badge" style="display:none">0</span>
        </a>
        <div class="hamburger" id="hamburger">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </nav>

  <!-- Mobile Navigation -->
  <div class="mobile-nav" id="mobile-nav">
    <a href="index.html">🏠 Home</a>
    <a href="menu.html">☕ Menu</a>
    <a href="subscription.html">⭐ Subscription</a>
    <a href="track-order.html">🚚 Track Order</a>
    <a href="cart.html">🛒 Cart</a>
  </div>

  <!-- ================= RESET PASSWORD CARD ================= -->
  <main class="section" style="padding-top: calc(var(--nav-height) + 40px); min-height: 85vh; display: flex; align-items: center;">
    <div class="container" style="max-width: 460px;">
      
      <div class="checkout-card" style="padding: 40px 32px; box-shadow: var(--shadow-lg); border-radius: var(--radius-xl); background: var(--white);">
        
        <div style="text-align: center; margin-bottom: 28px;">
          <div style="font-size: 2.2rem; margin-bottom: 8px;">🔒</div>
          <h1 style="font-size: 1.8rem; margin-bottom: 6px;">Set New Password</h1>
          <p style="color: var(--gray-600); font-size: 0.9rem;">
            Please enter your new secure password below to regain access to your account.
          </p>
        </div>

        <div id="reset-alert" style="display: none; padding: 12px 16px; border-radius: var(--radius-md); font-size: 0.88rem; margin-bottom: 20px;"></div>

        <form id="reset-form" onsubmit="handleResetPassword(event)">
          <div class="form-group" style="margin-bottom: 18px;">
            <label class="form-label" for="new-password">New Password</label>
            <div style="position: relative;">
              <input type="password" id="new-password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6" style="padding-right: 42px;">
              <button type="button" onclick="togglePasswordVisibility('new-password', 'toggle-new-icon')" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--gray-500);" aria-label="Toggle password visibility">
                <span id="toggle-new-icon">👁️</span>
              </button>
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 24px;">
            <label class="form-label" for="confirm-password">Confirm New Password</label>
            <div style="position: relative;">
              <input type="password" id="confirm-password" class="form-input" placeholder="Repeat your new password" required autocomplete="new-password" minlength="6" style="padding-right: 42px;">
              <button type="button" onclick="togglePasswordVisibility('confirm-password', 'toggle-confirm-icon')" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--gray-500);" aria-label="Toggle password visibility">
                <span id="toggle-confirm-icon">👁️</span>
              </button>
            </div>
          </div>

          <button type="submit" id="btn-reset-submit" class="btn btn-primary btn-full btn-lg" style="margin-bottom: 20px;">
            Update Password
          </button>
        </form>

        <div style="text-align: center; font-size: 0.88rem; color: var(--gray-600); border-top: 1px solid var(--gray-200); padding-top: 20px;">
          Remembered your password? <a href="login.html" style="color: var(--coffee); font-weight: 700; text-decoration: underline;">Back to Sign In</a>
        </div>

      </div>

    </div>
  </main>

  <!-- ================= SCRIPTS ================= -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/customer-auth.js"></script>

  <script>
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = '🙈';
      } else {
        input.type = 'password';
        icon.textContent = '👁️';
      }
    }

    function showAlert(msg, type = 'error') {
      const el = document.getElementById('reset-alert');
      el.textContent = msg;
      el.style.display = 'block';
      if (type === 'error') {
        el.style.background = '#fdecea';
        el.style.color = '#c0392b';
        el.style.border = '1px solid #fadbd8';
      } else {
        el.style.background = '#edf7f1';
        el.style.color = '#2d8a4e';
        el.style.border = '1px solid #d4efdf';
      }
    }

    // Listen for auth state change from recovery link
    const sb = getSupabase();
    if (sb) {
      sb.auth.onAuthStateChange(async (event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
          console.log('Password recovery mode enabled.');
        }
      });
    }

    async function handleResetPassword(e) {
      e.preventDefault();
      const p1 = document.getElementById('new-password').value;
      const p2 = document.getElementById('confirm-password').value;
      const btn = document.getElementById('btn-reset-submit');

      if (!p1 || p1.length < 6) {
        showAlert('Password must be at least 6 characters long.');
        return;
      }
      if (p1 !== p2) {
        showAlert('Passwords do not match.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = 'Updating Password...';

      try {
        await customerUpdatePassword(p1);
        showAlert('Password updated successfully! Redirecting to sign in...', 'success');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1800);
      } catch (err) {
        console.error('Password reset failure:', err);
        showAlert(err.message || 'Unable to update password. Your recovery link may have expired.');
        btn.disabled = false;
        btn.innerHTML = 'Update Password';
      }
    }
  </script>
</body>
</html>
